name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.3'

      - name: Test reviewed source
        run: |
          go test -race ./...
          go vet ./...

      - name: Build Linux amd64 release artifact
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/kube-blast-radius-linux-amd64 ./cmd/kube-blast-radius
          tar -C dist -czf "dist/kube-blast-radius_${GITHUB_REF_NAME}_linux_amd64.tar.gz" \
            kube-blast-radius-linux-amd64
          rm dist/kube-blast-radius-linux-amd64

      - name: Write deterministic checksum and minimal SBOM
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib

          tag = os.environ['GITHUB_REF_NAME']
          notes_path = pathlib.Path(f'Release_notes/{tag}.md')
          if not notes_path.is_file():
              raise SystemExit(f'missing versioned release notes: {notes_path}')
          artifact = pathlib.Path(f'dist/kube-blast-radius_{tag}_linux_amd64.tar.gz')
          if not artifact.is_file():
              raise SystemExit(f'missing expected artifact: {artifact}')
          sbom = {
              'bomFormat': 'CycloneDX',
              'specVersion': '1.5',
              'version': 1,
              'metadata': {'component': {'type': 'application', 'name': 'kube-blast-radius', 'version': tag}},
              'components': [
                  {'type': 'library', 'name': 'gopkg.in/yaml.v3', 'version': '3.0.1', 'licenses': [{'license': {'name': 'MIT AND Apache-2.0'}}]},
              ],
              'properties': [
                  {'name': 'kube-blast-radius.artifact.sha256', 'value': hashlib.sha256(artifact.read_bytes()).hexdigest()},
              ],
          }
          pathlib.Path('dist/sbom.cdx.json').write_text(json.dumps(sbom, indent=2) + '\n')
          PY
          (cd dist && sha256sum "kube-blast-radius_${GITHUB_REF_NAME}_linux_amd64.tar.gz" sbom.cdx.json > checksums.txt)

      - name: Verify release assets before upload
        run: |
          (cd dist && sha256sum -c checksums.txt)
          mkdir -p verify
          tar -xzf "dist/kube-blast-radius_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C verify
          test "$(verify/kube-blast-radius-linux-amd64 --version)" = "$GITHUB_REF_NAME"
          python3 - <<'PY'
          import hashlib, json, os, pathlib

          tag = os.environ['GITHUB_REF_NAME']
          artifact = pathlib.Path(f'dist/kube-blast-radius_{tag}_linux_amd64.tar.gz')
          sbom = json.loads(pathlib.Path('dist/sbom.cdx.json').read_text())
          assert sbom['bomFormat'] == 'CycloneDX'
          assert sbom['specVersion'] == '1.5'
          assert sbom['metadata']['component']['version'] == tag
          properties = {item['name']: item['value'] for item in sbom['properties']}
          assert properties['kube-blast-radius.artifact.sha256'] == hashlib.sha256(artifact.read_bytes()).hexdigest()
          print('minimal SBOM structure and artifact hash verified')
          PY

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file "Release_notes/${GITHUB_REF_NAME}.md" \
            "dist/kube-blast-radius_${GITHUB_REF_NAME}_linux_amd64.tar.gz" \
            dist/checksums.txt \
            dist/sbom.cdx.json
