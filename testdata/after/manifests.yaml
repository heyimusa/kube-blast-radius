apiVersion: v1
kind: ServiceAccount
metadata: {name: checkout, namespace: payments}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: checkout, namespace: payments}
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: checkout, namespace: payments}
subjects:
- kind: ServiceAccount
  name: checkout
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: checkout}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: payments}
spec:
  template:
    spec:
      serviceAccountName: checkout
      hostNetwork: true
      containers:
      - name: api
        image: example/checkout:v2
        securityContext:
          privileged: true
